apiVersion: apps/v1
kind: Deployment
metadata:
  name: convertlister
spec:
  replicas: 2
  selector:
    matchLabels:
      app: convertlister
  template:
    metadata:
      labels:
        app: convertlister
    spec:
      containers:
        - name: app
          image: convertlister:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
