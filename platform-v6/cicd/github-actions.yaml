name: SaaS CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker
        run: docker build -t saas-platform .

      - name: Kubernetes Deploy
        run: kubectl apply -f kubernetes/
